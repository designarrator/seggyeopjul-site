<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세겹줄에 초대받았어요</title>
<meta name="description" content="하루 5분, 같은 말씀으로 서로를 알아가요">
<meta property="og:type" content="website">
<meta property="og:site_name" content="세겹줄">
<meta property="og:title" content="세겹줄에 초대받았어요 💌">
<meta property="og:description" content="하루 5분, 같은 말씀으로 서로를 알아가요">
<meta property="og:image" content="https://designarrator.github.io/seggyeopjul-site/invite/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://designarrator.github.io/seggyeopjul-site/invite/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="세겹줄에 초대받았어요 💌">
<meta name="twitter:description" content="하루 5분, 같은 말씀으로 서로를 알아가요">
<meta name="twitter:image" content="https://designarrator.github.io/seggyeopjul-site/invite/og.png">
<link rel="stylesheet" href="../style.css">
<style>
/* 키트: 글자 24/34 · 17/27 · 15/24 세 단계, 간격 4px 배수, 모서리 16(버튼)/20(카드)/999(칩), 주 버튼 56 · 17/600 */
main.inv { max-width:440px; padding:32px 20px 48px; display:flex; flex-direction:column; gap:32px; }
.inv .head { display:flex; flex-direction:column; gap:8px; text-align:center; }
.inv .art { display:block; width:240px; height:240px; margin:0 auto 16px; object-fit:contain; background:#fff; mix-blend-mode:multiply; }
.inv h1 { margin:0; }
.inv .lead { margin:0; font-size:17px; line-height:27px; color:var(--sub); }
.code { background:var(--soft); border-radius:20px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.code small { font-size:15px; line-height:24px; color:var(--sub); }
.code strong { font-size:24px; line-height:34px; font-weight:700; letter-spacing:.12em; color:var(--primary); font-variant-numeric:tabular-nums; }
.btns { display:flex; flex-direction:column; gap:12px; }
.btn { display:flex; align-items:center; justify-content:center; width:100%; height:56px; border:0; border-radius:16px; font:inherit; font-size:17px; line-height:27px; font-weight:600; text-decoration:none; cursor:pointer; }
.btn.main { background:var(--primary); color:#fff; }
.btn.sub { background:var(--soft); color:var(--ink); }
.btn.copy { width:auto; height:44px; padding:0 20px; font-size:15px; line-height:24px; background:#fff; color:var(--primary); border-radius:999px; }
.hint { margin:0; font-size:15px; line-height:24px; color:var(--sub); text-align:center; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main class="inv">
<div class="head">
<video class="art" src="couple.mp4" poster="couple.png" width="240" height="240" autoplay muted loop playsinline preload="auto" aria-label="나란히 기대어 선 두 사람 그림"></video>
<h1>세겹줄에 초대받았어요</h1>
<p class="lead">하루 5분, 같은 말씀으로 서로를 알아가요</p>
</div>
<div class="code" id="codeBox" hidden>
<small>초대 코드</small>
<strong id="code"></strong>
<button class="btn copy" id="copy" type="button">코드 복사</button>
</div>
<div class="btns">
<button class="btn main" id="open" type="button">세겹줄 열기</button>
<a class="btn sub" href="https://apps.apple.com/kr/app/id6837890225">App Store에서 받기</a>
</div>
<p class="hint" id="hint">앱을 받은 뒤 «세겹줄 열기»를 누르거나<br>앱에서 초대 코드를 넣으면 바로 이어져요</p>
</main>
<script>
(function () {
  var STORE = "https://apps.apple.com/kr/app/id6837890225";
  var m = /[?&]c=([^&#]*)/.exec(location.search);
  var raw = m ? decodeURIComponent(m[1]) : "";
  var code = raw.replace(/[^A-Za-z0-9]/g, "").toUpperCase().slice(0, 6);
  var shown = code.length === 6 ? code.slice(0, 3) + "-" + code.slice(3) : code;
  var box = document.getElementById("codeBox");
  if (code) { document.getElementById("code").textContent = shown; box.hidden = false; }

  document.getElementById("copy").addEventListener("click", function () {
    var b = this, done = function () { b.textContent = "복사했어요"; setTimeout(function () { b.textContent = "코드 복사"; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shown).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var t = document.createElement("textarea"); t.value = shown; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(t);
    }
  });

  document.getElementById("open").addEventListener("click", function () {
    var left = false, t;
    function gone() { left = true; clearTimeout(t); }
    document.addEventListener("visibilitychange", function () { if (document.hidden) gone(); });
    window.addEventListener("pagehide", gone);
    window.addEventListener("blur", gone);
    t = setTimeout(function () { if (!left) location.href = STORE; }, 1500);
    location.href = "seggyeopjul://invite" + (code ? "?code=" + encodeURIComponent(code) : "");
  });
})();
</script>
</body>
</html>
